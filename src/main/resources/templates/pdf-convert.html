<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF转DOCX - 文档处理工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">文档处理工具</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="/translate">全文翻译</a>
                    <a class="nav-link active" href="/pdf-convert">PDF转DOCX</a>
                    <a class="nav-link" href="/ocr">图片转DOCX</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3 mt-md-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">PDF转DOCX</h4>
                    </div>
                    <div class="card-body">
                        <form id="convertForm">
                            <div class="mb-3">
                                <label class="form-label">选择PDF文件</label>
                                <div class="file-upload-area" id="uploadArea">
                                    <input type="file" id="file" name="file" accept=".pdf" required>
                                    <div class="file-upload-icon" style="background: linear-gradient(135deg, #28a745, #20c997);">
                                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                    </div>
                                    <div class="upload-label">点击或拖拽上传文件</div>
                                    <div class="upload-hint">支持 .pdf 格式</div>
                                    <div class="file-selected">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#28a745" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="9 15 11 17 15 13"/></svg>
                                        <span id="fileName"></span>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success" id="submitBtn">
                                开始转换
                            </button>
                        </form>

                        <div id="result" class="mt-4" style="display: none;">
                            <div class="alert alert-success">
                                <h5>转换完成!</h5>
                                <p id="resultText"></p>
                                <a id="downloadLink" href="#" class="btn btn-success">下载DOCX文件</a>
                            </div>
                        </div>

                        <div id="error" class="mt-4" style="display: none;">
                            <div class="alert alert-danger">
                                <h5>转换失败</h5>
                                <p id="errorText"></p>
                            </div>
                        </div>

                        <div id="loading" class="mt-4" style="display: none;">
                            <div class="text-center">
                                <div class="spinner-border text-success" role="status">
                                    <span class="visually-hidden">处理中...</span>
                                </div>
                                <p class="mt-2">正在转换文档，请稍候...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.getElementById('convertForm').addEventListener('submit', function(e) {
            e.preventDefault();
            uploadFile('/api/pdf-convert', 'file', 'result', 'error', 'loading', 'submitBtn');
        });
    </script>
    <script src="/js/file-upload.js"></script>
</body>
</html>
