<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>视频格式转换 - 文档处理工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">文档处理工具</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="/translate">全文翻译</a>
                    <a class="nav-link" href="/pdf-convert">PDF转DOCX</a>
                    <a class="nav-link" href="/ocr">图片转DOCX</a>
                    <a class="nav-link" href="/anim-to-video">动态图转视频</a>
                    <a class="nav-link" href="/video">视频图片分析</a>
                    <a class="nav-link active" href="/video-convert">视频转换</a>
                </div>
                <div class="navbar-nav ms-auto">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">退出登录</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3 mt-md-4">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">视频格式转换</h5>
            </div>
            <div class="card-body">
                <div class="upload-area" id="convertUploadArea">
                    <div class="upload-icon">MP4</div>
                    <p class="mb-2">点击或拖拽上传视频文件</p>
                    <p class="text-muted small">支持 MP4、AVI、WebM、MOV、MKV 等格式</p>
                    <input type="file" id="convertFile" accept="video/*" style="display:none">
                    <div class="selected-file" id="convertFileName"></div>
                </div>
                <div class="mt-3">
                    <label class="form-label">目标格式</label>
                    <select class="form-select" id="convertFormat">
                        <option value="mp4" selected>MP4 (H.264)</option>
                        <option value="avi">AVI</option>
                        <option value="webm">WebM (VP9)</option>
                        <option value="mov">MOV</option>
                        <option value="mkv">MKV</option>
                        <option value="gif">GIF</option>
                    </select>
                </div>
                <button class="btn btn-primary mt-3" id="convertBtn" onclick="doConvert()">开始转换</button>
                <div id="convertLoading" class="text-center mt-3" style="display:none">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2">正在转换，请稍候...</p>
                </div>
                <div id="convertResult" class="mt-3" style="display:none"></div>
                <div id="convertError" class="alert alert-danger mt-3" style="display:none"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 上传区域交互
        document.querySelectorAll('.upload-area').forEach(area => {
            const input = area.querySelector('input[type="file"]');
            const fileNameDiv = area.querySelector('.selected-file');

            area.addEventListener('click', () => input.click());
            area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('drag-over'); });
            area.addEventListener('dragleave', () => area.classList.remove('drag-over'));
            area.addEventListener('drop', e => {
                e.preventDefault();
                area.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    input.files = e.dataTransfer.files;
                    if (fileNameDiv) fileNameDiv.textContent = e.dataTransfer.files[0].name;
                    area.classList.add('has-file');
                }
            });
            input.addEventListener('change', () => {
                if (input.files.length > 0) {
                    if (fileNameDiv) fileNameDiv.textContent = input.files[0].name;
                    area.classList.add('has-file');
                }
            });
        });

        async function doConvert() {
            const file = document.getElementById('convertFile').files[0];
            if (!file) { alert('请选择视频文件'); return; }
            const format = document.getElementById('convertFormat').value;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('format', format);

            document.getElementById('convertLoading').style.display = 'block';
            document.getElementById('convertResult').style.display = 'none';
            document.getElementById('convertError').style.display = 'none';
            document.getElementById('convertBtn').disabled = true;

            try {
                const resp = await fetch('/api/video/convert', { method: 'POST', body: formData });
                if (resp.ok) {
                    const blob = await resp.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name.replace(/\.[^.]+$/, '') + '_converted.' + format;
                    a.click();
                    URL.revokeObjectURL(url);
                    document.getElementById('convertResult').innerHTML =
                        '<div class="alert alert-success">转换完成，文件已下载</div>';
                    document.getElementById('convertResult').style.display = 'block';
                } else {
                    const data = await resp.json();
                    document.getElementById('convertError').textContent = data.errorMessage || '转换失败';
                    document.getElementById('convertError').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('convertError').textContent = '请求失败: ' + e.message;
                document.getElementById('convertError').style.display = 'block';
            } finally {
                document.getElementById('convertLoading').style.display = 'none';
                document.getElementById('convertBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
