<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文档处理工具</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">文档处理工具</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav"
                    aria-expanded="false" aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                    <a class="nav-link" href="/translate">全文翻译</a>
                    <a class="nav-link" href="/pdf-convert">PDF转DOCX</a>
                    <a class="nav-link" href="/ocr">图片转DOCX</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-3 mt-md-4">
        <!-- 功能入口卡片 -->
        <div class="row">
            <div class="col-4 mb-2 mb-md-4">
                <a href="/translate" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <div class="card-body">
                            <div class="feature-icon">译</div>
                            <h5 class="card-title">全文翻译</h5>
                            <p class="card-text">上传DOC/DOCX文档，自动识别并翻译</p>
                            <span class="btn btn-primary btn-enter">开始翻译</span>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-4 mb-2 mb-md-4">
                <a href="/pdf-convert" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <div class="card-body">
                            <div class="feature-icon" style="background: linear-gradient(135deg, #28a745, #20c997);">PDF</div>
                            <h5 class="card-title">PDF转DOCX</h5>
                            <p class="card-text">将PDF转换为可编辑DOCX文档</p>
                            <span class="btn btn-success btn-enter">开始转换</span>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-4 mb-2 mb-md-4">
                <a href="/ocr" class="text-decoration-none">
                    <div class="card feature-card h-100">
                        <div class="card-body">
                            <div class="feature-icon" style="background: linear-gradient(135deg, #f0ad4e, #e67e22);">OCR</div>
                            <h5 class="card-title">图片转DOCX</h5>
                            <p class="card-text">识别图片文字生成DOCX文档</p>
                            <span class="btn btn-warning btn-enter">开始识别</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- 桌面端表格 -->
        <div class="card mt-4 records-table-wrapper">
            <div class="card-header">
                <h5>处理记录</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th class="d-none d-md-table-cell">ID</th>
                            <th>类型</th>
                            <th>原始文件</th>
                            <th>状态</th>
                            <th class="d-none d-md-table-cell">创建时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="record : ${records}">
                            <td class="d-none d-md-table-cell" th:text="${record.id}"></td>
                            <td>
                                <span th:if="${record.taskType == 'TRANSLATE'}" class="badge bg-primary">翻译</span>
                                <span th:if="${record.taskType == 'PDF_CONVERT'}" class="badge bg-success">PDF转换</span>
                                <span th:if="${record.taskType == 'OCR'}" class="badge bg-warning">OCR识别</span>
                            </td>
                            <td class="text-break" th:text="${record.originalFilename}"></td>
                            <td>
                                <span th:if="${record.status == 'SUCCESS'}" class="badge bg-success">成功</span>
                                <span th:if="${record.status == 'FAILED'}" class="badge bg-danger">失败</span>
                                <span th:if="${record.status == 'PROCESSING'}" class="badge bg-info">处理中</span>
                                <span th:if="${record.status == 'PENDING'}" class="badge bg-secondary">等待中</span>
                            </td>
                            <td class="d-none d-md-table-cell" th:text="${record.createTime}"></td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>

        <!-- 手机端卡片列表 -->
        <div class="mt-3 records-mobile-list">
            <h5 style="font-weight:700; margin-bottom:0.6rem; font-size:0.95rem;">处理记录</h5>
            <div th:each="record : ${records}" class="record-card">
                <div th:if="${record.taskType == 'TRANSLATE'}" class="record-card-icon type-translate">译</div>
                <div th:if="${record.taskType == 'PDF_CONVERT'}" class="record-card-icon type-pdf">PDF</div>
                <div th:if="${record.taskType == 'OCR'}" class="record-card-icon type-ocr">OCR</div>
                <div class="record-card-body">
                    <div class="record-card-name" th:text="${record.originalFilename}"></div>
                    <div class="record-card-meta">
                        <span th:if="${record.taskType == 'TRANSLATE'}">翻译</span>
                        <span th:if="${record.taskType == 'PDF_CONVERT'}">PDF转换</span>
                        <span th:if="${record.taskType == 'OCR'}">OCR识别</span>
                        <span th:if="${record.status == 'SUCCESS'}" class="record-card-status status-success">成功</span>
                        <span th:if="${record.status == 'FAILED'}" class="record-card-status status-failed">失败</span>
                        <span th:if="${record.status == 'PROCESSING'}" class="record-card-status status-processing">处理中</span>
                        <span th:if="${record.status == 'PENDING'}" class="record-card-status status-pending">等待中</span>
                    </div>
                    <div th:if="${record.status == 'FAILED'}" class="record-card-error" th:text="${record.errorMessage}"></div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(records)}" style="text-align:center; color:#aaa; padding:1.5rem 0; font-size:0.85rem;">
                暂无处理记录
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
