server:
  port: 8081
  servlet:
    context-path: /
  shutdown: graceful

spring:
  profiles:
    active: @profile.active@
  lifecycle:
    timeout-per-shutdown-phase: 10s
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  web:
    resources:
      cache:
        period: 0
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.doctool.model
  configuration:
    map-underscore-to-camel-case: true

# 翻译设置
translate:
  # 翻译完成后是否清理红字水印（如原文档自带的 Spire 评估警告），默认开启
  remove-red-watermark: true

# OCR Tesseract data path - 通过环境变量 TESSDATA_PATH 覆盖，适配不同系统
# Windows: 根据实际安装路径设置，如 D:\Program Files\Tesseract-OCR\tessdata
# Linux/iStoreOS 默认: /usr/share/tessdata
tesseract:
  datapath: ${TESSDATA_PATH:/usr/share/tessdata}
