server:
  port: 8081
  servlet:
    context-path: /
  shutdown: graceful
  tomcat:
    connection-timeout: 300000
    max-http-form-post-size: 100MB

spring:
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 10s
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  web:
    resources:
      cache:
        period: 0
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.doctool.model
  configuration:
    map-underscore-to-camel-case: true

# 翻译设置
translate:
  # 翻译引擎：google（免费，默认） 或 microsoft（需填写 api-key）
  provider: ${TRANSLATE_PROVIDER:google}
  # Microsoft Translator API Key（Azure 免费申请，每月 200 万字符）
  api-key: ${TRANSLATE_API_KEY:}
  # 翻译完成后是否清理红字水印（如原文档自带的 Spire 评估警告），默认开启
  remove-red-watermark: true

# OCR Tesseract data path - 通过环境变量 TESSDATA_PATH 覆盖，适配不同系统
# Windows: 根据实际安装路径设置，如 D:\Program Files\Tesseract-OCR\tessdata
# Linux/iStoreOS 默认: /usr/share/tessdata
tesseract:
  datapath: ${TESSDATA_PATH:/usr/share/tessdata}

# FFmpeg 路径 - 通过环境变量 FFMPEG_PATH 覆盖，默认从系统 PATH 查找
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

# AI 服务配置
ai-server:
  url: ${AI_SERVER_URL:http://localhost:5001}
  script: ${AI_SERVER_SCRIPT:ai-server/server.py}
  auto-start: ${AI_SERVER_AUTO_START:false}

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  # 可用视觉模型：
  #   qwen2.5-vl-uncensored  - 推荐，3B，abliterated 版
  #   minicpm-v-uncensored   - 5.5B，中文好
  #   llava-uncensored        - 4.7B，英文好
  model: ${OLLAMA_MODEL:qwen2.5-vl-uncensored}
  summary-model: ${OLLAMA_SUMMARY_MODEL:}
